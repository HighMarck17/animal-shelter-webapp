services:

  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [shelter_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # Password-protected default user. Denied: Lua scripting (the EVAL
    # use-after-free RCE class, e.g. CVE-2025-49844), admin commands and
    # "dangerous" ones (KEYS, FLUSHALL, RESTORE, MIGRATE, DEBUG, ...).
    # FLUSHDB stays allowed: Django's cache.clear() uses it.
    command:
      - redis-server
      - --user
      - default
      - "on"
      - ">${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      - "~*"
      - "&*"
      - "+@all"
      - "-@scripting"
      - "-@admin"
      - "-@dangerous"
      - "+flushdb"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [shelter_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      DJANGO_ENVIRONMENT: production
      # Only nginx can reach web, and it overwrites X-Real-IP with the peer address
      CLIENT_IP_META_KEY: HTTP_X_REAL_IP
    env_file:
      - .env
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [shelter_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - staticfiles:/app/staticfiles:ro
      - certbot_webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_started
    networks: [shelter_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    profiles: [certbot]

  test:
    build:
      context: .
      target: test
    entrypoint: ["python", "-m", "pytest"]
    command: ["--tb=short", "-q"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test_pg
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [shelter_net]
    profiles:
      - test

volumes:
  postgres_data:
  staticfiles:
  certbot_webroot:

networks:
  shelter_net:
    driver: bridge
