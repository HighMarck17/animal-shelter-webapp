version: 2
updates:
  # requirements/*.in + hash-locked *.txt (pip-compile, see requirements/compile.sh)
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on the Django 5.2 LTS line; moving to the next LTS is a planned upgrade
      - dependency-name: django
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python runtime upgrades (3.12 -> 3.13) are deliberate, patches are not
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A PostgreSQL major needs a dump/restore or pg_upgrade of the data volume
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
      # Even minors are nginx stable branches, odd ones mainline: move by hand
      - dependency-name: nginx
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
