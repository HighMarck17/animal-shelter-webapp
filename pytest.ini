[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
# Only collect tests from the apps package. This keeps pytest from picking up
# config/settings/test_pg.py (a settings module, not a test module) whose name
# matches the test_*.py pattern below.
testpaths = apps
python_files = tests.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Code that Django 6.0/6.1 removes must fail the tests now, not after the upgrade
filterwarnings =
    error::django.utils.deprecation.RemovedInDjango60Warning
    error::django.utils.deprecation.RemovedInDjango61Warning
